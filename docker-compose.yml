services:
  w2run:
    build: .
    image: w2run:latest
    container_name: w2run
    restart: unless-stopped
    # Persist OSM / elevation / DEM caches across restarts & rebuilds.
    volumes:
      - ./cache:/app/cache
    networks:
      - website_virtual-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=website_virtual-network"
      # ---- Router (HTTPS) — set W2RUN_DOMAIN in a .env file on the server ----
      - "traefik.http.routers.w2run.rule=Host(`${W2RUN_DOMAIN}`)"
      - "traefik.http.routers.w2run.entrypoints=websecure"
      - "traefik.http.routers.w2run.tls=true"
      - "traefik.http.routers.w2run.tls.certresolver=default"
      - "traefik.http.routers.w2run.service=w2run-svc"
      # ---- Service (container port) ----
      - "traefik.http.services.w2run-svc.loadbalancer.server.port=8000"

networks:
  website_virtual-network:
    external: true
